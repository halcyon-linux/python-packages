[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "powersave"
version = "1.0.0"
description = "Switch the power-profiles-daemon active profile from the command line."
requires-python = ">=3.13"
license = "Apache-2.0"

[project.scripts]
powersave = "powersave:main"

[tool.setuptools.packages.find]
where = ["src"]
