[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "snapper-config"
version = "1.0.0"
description = "Manage the root snapper config: enable, clean, wipe, or disable it."
requires-python = ">=3.13"
license = "Apache-2.0"

[project.scripts]
snapper-config = "snapper_config:main"

[tool.setuptools.packages.find]
where = ["src"]
