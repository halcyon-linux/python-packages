[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fe"
version = "1.0.0"
description = "Fuzzy edit — pick a file with fd/fzf and open it in $EDITOR."
requires-python = ">=3.10"
license = "Apache-2.0"

[project.scripts]
fe = "fe:main"

[tool.setuptools.packages.find]
where = ["src"]

