[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "halcyon-boot-remount"
version = "1.0.0"
description = "Remount /boot read-write for an operation and restore the prior mount state."
requires-python = ">=3.13"
license = "Apache-2.0"

[project.scripts]
halcyon-boot-remount = "halcyon_boot_remount:main"

[tool.setuptools.packages.find]
where = ["src"]
