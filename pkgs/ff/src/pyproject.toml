[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ff"
version = "1.0.0"
description = "Fast file finder wrapping fd with a find fallback."
requires-python = ">=3.10"
license = "Apache-2.0"

[project.scripts]
ff = "ff:main"

[tool.setuptools.packages.find]
where = ["src"]

