[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nvidia-flatpak-runtime"
version = "1.0.0"
description = "Check, install, and notify about NVIDIA Flatpak runtimes matching the system driver."
requires-python = ">=3.13"
license = "Apache-2.0"

[project.scripts]
nvidia-flatpak-runtime-sync = "nvidia_flatpak_runtime:sync_main"
nvidia-flatpak-runtime-notify = "nvidia_flatpak_runtime:notify_main"

[tool.setuptools.packages.find]
where = ["src"]
