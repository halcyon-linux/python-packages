[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rmtmp"
version = "1.0.0"
description = "Root-only secure cleanup of old files in /tmp and /var/tmp."
requires-python = ">=3.10"
license = "Apache-2.0"

[project.scripts]
rmtmp = "rmtmp:main"

[tool.setuptools.packages.find]
where = ["src"]

