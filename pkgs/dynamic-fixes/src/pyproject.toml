[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-fixes"
version = "1.0.0"
description = "Toggle the GSK_RENDERER=gl workaround when an Intel GPU (xe/i915) is in use."
requires-python = ">=3.13"
license = "Apache-2.0"

[project.scripts]
dynamic-fixes = "dynamic_fixes:main"

[tool.setuptools.packages.find]
where = ["src"]
