[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gameclass"
version = "1.0.0"
description = "Set WM_CLASS for windows opened by a wrapped game command."
requires-python = ">=3.13"
license = "Apache-2.0"

[project.scripts]
gameclass = "gameclass:main"

[tool.setuptools.packages.find]
where = ["src"]
