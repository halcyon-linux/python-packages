# copr-build — build python-packages on Fedora Copr.
#
# Cloned from the cli-tools group repo: Copr owns the build farm, the signing
# (per-project key) and the repo serving. This repo's packages are
# halcyon-original tools with sources vendored under pkgs/<pkg>/src — there
# are no upstream tarballs to fetch, so the submit step packs the source
# tarball from the package dir (see below) instead of spectool -g.
#
#   manifest   ci/matrix.py selects packages from the git push (changed dirs
#              + their BuildRequires dependents) and emits one build_matrix
#              per batch (all packages here are batch 0 — one wave)
#   submit0    pack each package's vendored src/ tree into its Source0
#              tarball + rpmbuild -bs per package and
#              `copr-cli build --nowait python-packages <srpm>`; the build id
#              lands in an artifact
#   waitN      `copr-cli watch-build` over the wave's ids, then a status
#              re-check so a failed build fails the run. Copr makes each
#              successful build visible to the project repo immediately, so
#              wave N+1's buildroot sees wave N's output — the same guarantee
#              the Pages publish used to provide, without the publish step.
#
# PRs run the validate job only (no Copr builds — checks are syntax + registry
# level; a failed Copr build leaves the published repo on the last good
# version, so main-line failures are self-healing).
#
# External repos (per-chroot, copr-cli edit-chroot): the lionheartp/Hyprland
# Copr as a lowest-priority bootstrap for fresh projects, and Terra 44 (it
# supplies anda-srpm-macros, which Fedora 44 does not carry).
name: copr-build

on:
  push:
    branches: [main]
    paths: ["pkgs/**", "ci/**", ".github/builder/**", ".github/workflows/copr-build.yml"]
  pull_request:
    paths: ["pkgs/**", "ci/**", ".github/builder/**", ".github/workflows/copr-build.yml"]
  workflow_dispatch:
    inputs:
      only:
        description: "Packages to build (space separated); empty = all"
        required: false
        default: ""

permissions:
  contents: read
  packages: read

concurrency:
  group: copr-build-${{ github.ref }}
  cancel-in-progress: false

env:
  COPR_PROJECT: python-packages

jobs:
  validate:
    name: Validate the registry
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Wait for the builder image of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # builder-docker rebuilds the image on the same pushes that trigger
          # this workflow (.github/builder/**); without this gate the submit
          # jobs race it and some pull the stale image. When no builder-image
          # run exists for this SHA the image inputs did not change and there
          # is nothing to wait for.
          for i in $(seq 1 60); do
            run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/builder-docker.yml/runs?head_sha=${{ github.sha }}&per_page=1" \
              --jq '.workflow_runs[0].id // empty')
            if [ -z "$run_id" ]; then
              echo "no builder-image run for ${{ github.sha }} — image unchanged"
              exit 0
            fi
            read -r status conclusion <<<"$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status + " " + (.conclusion // "-")')"
            if [ "$status" = completed ]; then
              [ "$conclusion" = success ] || { echo "builder-image run $run_id: $conclusion"; exit 1; }
              echo "builder-image run $run_id is green"
              exit 0
            fi
            echo "builder-image run $run_id: $status; waiting ($i/60)"
            sleep 20
          done
          echo "timed out waiting for the builder image"; exit 1
      - name: Shell syntax + lint (package helper scripts)
        run: |
          set -eu
          # bash -n, not sh -n: every script here is bash (arrays, process
          # substitution), and /bin/sh is dash on the runners
          shopt -s nullglob
          scripts=(pkgs/*/*.sh)
          for f in "${scripts[@]}"; do
            bash -n "$f"
          done
          # the shellcheck binary ships preinstalled on the runners; a repo
          # with no helper scripts lints nothing (nullglob, not a literal glob)
          if [ "${#scripts[@]}" -gt 0 ]; then
            shellcheck -S warning "${scripts[@]}"
          fi
      - name: Python syntax
        # no ci/sweep/ in this repo (halcyon-authored tools have no upstream
        # to sweep — bumps are manual spec edits)
        run: python3 -m py_compile ci/*.py
      - name: Registry consistency + build plan
        run: |
          set -eu
          python3 ci/matrix.py --list
          BEFORE="${{ github.event.before }}"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            python3 ci/matrix.py --list --since "$BEFORE"
          fi
      - name: Lint the workflows (actionlint + shellcheck)
        run: |
          set -euo pipefail
          # pinned release + checksum: no curl-to-bash, no floating tags
          version=1.7.12
          checksum=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          echo "${checksum}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color

  manifest:
    name: Build matrix (per batch)
    needs: validate
    # PRs stop here: validation only, no Copr builds. Push cascades are
    # gated on the CASCADE_ENABLED repo variable (kill-switch + lets a fresh
    # repo be pushed without firing a full rebuild); workflow_dispatch and
    # the workflow's own bump/roll dispatches always run.
    if: github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || vars.CASCADE_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      batches: ${{ steps.split.outputs.batches }}
      batch0: ${{ steps.split.outputs.batch0 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Resolve the selection
        id: selection
        env:
          ONLY: ${{ inputs.only }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          if [ -n "${ONLY:-}" ]; then
            echo "args=--only ${ONLY}" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = push ] && [ -n "${BEFORE:-}" ] \
               && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "args=--since ${BEFORE}" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi
      - name: Split the matrix into batch waves
        id: split
        env:
          SELECT_ARGS: ${{ steps.selection.outputs.args }}
        run: |
          set -eu
          # Word splitting on SELECT_ARGS is intended — it is a flag list.
          # shellcheck disable=SC2086
          python3 ci/matrix.py $SELECT_ARGS > /tmp/matrix.out
          # the matrix output is read from a file: feeding it through a pipe
          # alongside the heredoc below would make the heredoc override the
          # pipe and the parser would see nothing
          python3 - "$GITHUB_OUTPUT" /tmp/matrix.out <<'PY'
          import json, sys
          out = sys.argv[1]
          matrix, batches = [], []
          for line in open(sys.argv[2]):
              if line.startswith("build_matrix="):
                  matrix = json.loads(line[len("build_matrix="):].strip())
              elif line.startswith("batches="):
                  batches = line[len("batches="):].strip().split(",")
          if not matrix:
              print("no entries")
          def with_output(name, value):
              with open(f"{out}", "a") as fh:
                  fh.write(f"{name}={value}\n")
          with_output("batches", ",".join(batches))
          for b in batches:
              entries = [e for e in matrix if e["labels"]["batch"] == b]
              with_output(f"batch{b}", json.dumps(entries, sort_keys=True))
              print(f"batch {b}: {len(entries)} package(s)")
          PY

  submit0:
    name: "submit batch 0"
    needs: manifest
    if: needs.manifest.outputs.batch0 != ''
    strategy:
      matrix:
        pkg: ${{ fromJson(needs.manifest.outputs.batch0) }}
      fail-fast: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/halcyon-linux/python-packages-builder:f44
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}

    steps:
      - name: Workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Copr credentials
        env:
          COPR_CLICONF: ${{ secrets.COPR_CLICONF }}
        run: |
          set -eu
          mkdir -p ~/.config
          printf '%s\n' "$COPR_CLICONF" > ~/.config/copr
          chmod 600 ~/.config/copr
      - name: Build the SRPM and submit to Copr
        env:
          NAME: ${{ matrix.pkg.name }}
          PROJECT: ${{ matrix.pkg.labels.project }}
        run: |
          set -euo pipefail
          spec="pkgs/$NAME/$NAME.spec"
          mkdir -p "_srpms/$NAME"
          # vendored sources: no upstream URL to fetch, so pack Source0 from
          # pkgs/$NAME/src (pyproject.toml + src/ + tests/ + LICENSE). The
          # tarball carries a top-level %{name}-%{version} dir; %autosetup
          # unpacks it without -c.
          ver=$(sed -n 's/^Version:[[:space:]]*//p' "$spec")
          [ -n "$ver" ] || { echo "no Version in $spec"; exit 1; }
          mkdir -p "_srpms/$NAME/$NAME-$ver"
          cp -a "pkgs/$NAME/src/." "_srpms/$NAME/$NAME-$ver/"
          tar czf "_srpms/$NAME/$NAME-$ver.tar.gz" -C "_srpms/$NAME" "$NAME-$ver"
          srpm=$(rpmbuild -bs \
              --define "_sourcedir $PWD/_srpms/$NAME" \
              --define "_srcrpmdir $PWD/_srpms" \
              --define "_specdir $PWD/$(dirname "$spec")" \
              "$spec" | sed -n 's/^Wrote: //p')
          [ -n "$srpm" ] || { echo "rpmbuild -bs produced no SRPM"; exit 1; }
          copr-cli build --nowait "$PROJECT" "$srpm" | tee submit.log
          id=$(sed -n 's/^Created builds: //p' submit.log)
          [ -n "$id" ] || { echo "no build id in copr-cli output"; exit 1; }
          echo "$id" > "build-id-$NAME.txt"
      - name: Upload the build id
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: "submit-0-${{ matrix.pkg.name }}"
          path: build-id-*.txt
          if-no-files-found: error
          retention-days: 3

  wait0:
    name: "wait for batch 0"
    needs: [manifest, submit0]
    # empty wave: pass through green; failed submit: skipped (halts the chain)
    if: always() && (needs.manifest.outputs.batch0 == '' || needs.submit0.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 330
    container:
      image: ghcr.io/halcyon-linux/python-packages-builder:f44
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}

    steps:
      - name: Copr credentials
        if: needs.manifest.outputs.batch0 != ''
        env:
          COPR_CLICONF: ${{ secrets.COPR_CLICONF }}
        run: |
          set -eu
          mkdir -p ~/.config
          printf '%s\n' "$COPR_CLICONF" > ~/.config/copr
          chmod 600 ~/.config/copr
      - name: Download the wave's build ids
        if: needs.manifest.outputs.batch0 != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: "submit-0-*"
          merge-multiple: true
          path: ids
      - name: Watch the wave's builds
        if: needs.manifest.outputs.batch0 != ''
        run: |
          set -eu
          ids=$(cat ids/build-id-*.txt | tr '\n' ' ')
          echo "watching builds: $ids"
          # the ids are one space-joined list
          # shellcheck disable=SC2086
          copr-cli watch-build $ids
          # watch-build's exit code is not a contract; re-check every id so a
          # failed build fails this job no matter what
          rc=0
          # shellcheck disable=SC2086
          for id in $ids; do
            status=$(copr-cli status "$id")
            if [ "$status" != succeeded ]; then
              echo "build $id: $status"
              rc=1
            fi
          done
          exit $rc

